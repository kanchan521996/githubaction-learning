name: Deploy website

on:
  push:
    branches:
      - dev

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Get code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci
        working-directory: 01 Starting Project

      - name: Test code
        run: npm run test
        working-directory: 01 Starting Project

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Get code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci
        working-directory: 01 Starting Project

      - name: Build code
        run: npm run build
        working-directory: 01 Starting Project
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        run: echo "deploying...."
      
