name: Events Demo 1

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Get code
        uses: actions/checkout@v4

      - name: Output event data
        run: echo '${{ toJSON(github.event) }}'
        working-directory: 01 Starting Project

      - name: Install dependencies
        run: npm ci
        working-directory: 01 Starting Project

      - name: Test code
        run: npm run test
        working-directory: 01 Starting Project

      - name: Build code
        run: npm run build
        working-directory: 01 Starting Project

      - name: Deploy project
        run: echo "Deploying..."
        working-directory: 01 Starting Project